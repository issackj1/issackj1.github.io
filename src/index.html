    <style>
        :root {
            /*
             * THE SHIPPING LEDGER
             * Editorial proof, hard edges, deployed systems. Sparse by default;
             * the work is the ornament.
             */

            /* Type Scale */
            --type-display: clamp(3rem, 9vw, 6.75rem);
            --type-headline: clamp(1.55rem, 4vw, 2.6rem);
            --type-body: 1.0625rem;
            --type-small: 0.875rem;
            --type-mono: 0.8125rem;

            /* Fonts */
            --font-display: 'Newsreader', 'Iowan Old Style', Georgia, serif;
            --font-body: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
            --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace;

            /* Light mode */
            --ink: #111111;
            --paper: #fbf7ef;
            --gray: #5d574c;
            --faint: #efe7d8;
            --border: #d7cbb7;
            --accent: #d6451f;

            /* Zero decoration */
            --radius: 0;

            /* Spacing */
            --max-width: 52rem;
            --transition: 100ms ease;
        }

        :root[data-theme="dark"] {
            --ink: #f3ead8;
            --paper: #080807;
            --gray: #aaa08e;
            --faint: #171410;
            --border: #30291f;
            --accent: #ff6a38;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            font-size: var(--type-body);
            background:
                linear-gradient(90deg, color-mix(in srgb, var(--border) 36%, transparent) 1px, transparent 1px),
                linear-gradient(180deg, color-mix(in srgb, var(--border) 30%, transparent) 1px, transparent 1px),
                radial-gradient(circle at 84% 8%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 24rem),
                var(--paper);
            background-size: 44px 44px, 44px 44px, auto, auto;
            color: var(--ink);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }

        main {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 2rem;
            background: color-mix(in srgb, var(--paper) 82%, transparent);
            backdrop-filter: blur(2px);
        }

        ::selection {
            background: var(--ink);
            color: var(--paper);
        }

        a {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 1px;
        }

        a:hover {
            text-decoration-thickness: 2px;
        }
    </style>
    <script type="module" src="./index.ts"></script>
</head>

    </main>
    <footer-bar></footer-bar>
</body>
